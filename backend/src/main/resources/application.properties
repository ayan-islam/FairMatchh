spring.application.name=fairmatch-backend
spring.config.import=optional:file:../data/integrations.properties
server.address=127.0.0.1
server.port=${PORT:8080}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27018/fairmatch?replicaSet=fairmatch-rs}
spring.data.mongodb.auto-index-creation=true
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
fairmatch.demo.username=${FAIRMATCH_USERNAME:recruiter}
fairmatch.demo.password=${FAIRMATCH_PASSWORD:LocalTestEmployer!2026}
fairmatch.seed=${FAIRMATCH_SEED:false}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB

# Rating and weight inputs must be integers, not silently truncated decimals.
spring.jackson.deserialization.accept-float-as-int=false
